# Mirrors the CloudFront setup: /folder/ serves folder/index.html and
# missing paths get 404.html with a real 404 status.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}

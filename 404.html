<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada · Cayetano Yeste</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved light/dark choice before the first paint (see src/lib/theme.ts).
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <main class="container" style="padding: 6rem 1rem">
      <p class="eyebrow">Error 404</p>
      <h1>Esta página no existe</h1>
      <p class="muted">Puede que el enlace esté mal o que la página se haya movido.</p>
      <p><a href="/" class="button primary">Volver al inicio</a></p>
    </main>
  </body>
</html>

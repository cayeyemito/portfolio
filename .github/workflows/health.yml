name: Health

on:
  schedule:
    - cron: '0 6 * * *' # every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for AWS

jobs:
  health:
    runs-on: ubuntu-latest
    # Skipped until the infrastructure exists and SITE_URL is set (see README).
    if: vars.SITE_URL != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ops/requirements.txt
      - run: pip install -r ops/requirements.txt

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run checks
        id: checks
        run: >-
          python ops/site_health.py
          --url "${{ vars.SITE_URL }}"
          --bucket "${{ vars.SITE_BUCKET }}"
          --logs-bucket "${{ vars.LOGS_BUCKET }}"
          --out report

      # Publish the report even when a check failed: that is when it matters most.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health-report
          path: report/
          retention-days: 30

      - name: Publish to /status
        if: always() && hashFiles('report/report.json') != ''
        run: |
          aws s3 cp report/report.html "s3://${{ vars.SITE_BUCKET }}/status/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache"
          aws s3 cp report/report.json "s3://${{ vars.SITE_BUCKET }}/status/report.json" \
            --content-type "application/json" --cache-control "no-cache"

name: Health

on:
  schedule:
    - cron: '0 6 * * *' # every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Azure

jobs:
  health:
    runs-on: ubuntu-latest
    # Skipped until the infrastructure exists and SITE_URL is set (see README).
    if: vars.SITE_URL != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ops/requirements.txt
      - run: pip install -r ops/requirements.txt

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run checks
        id: checks
        run: >-
          python ops/site_health.py
          --url "${{ vars.SITE_URL }}"
          --account "${{ vars.SITE_STORAGE_ACCOUNT }}"
          --workspace "${{ vars.LOG_WORKSPACE_ID }}"
          --out report

      # Publish the report even when a check failed: that is when it matters most.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: health-report
          path: report/
          retention-days: 30

      - name: Publish to /status
        if: always() && hashFiles('report/report.json') != ''
        run: |
          upload() {
            az storage blob upload --auth-mode login --overwrite --only-show-errors \
              --account-name "${{ vars.SITE_STORAGE_ACCOUNT }}" --container-name "\$web" \
              --file "$1" --name "$2" --content-type "$3" --content-cache-control "no-cache"
          }
          upload report/report.html status/index.html "text/html; charset=utf-8"
          upload report/report.json status/report.json "application/json"

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for AWS

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skipped until the infrastructure exists and SITE_BUCKET is set (see README).
    if: vars.SITE_BUCKET != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets are cached for a year; HTML and the rest must revalidate.
      # status/ belongs to the health workflow, so --delete must not touch it.
      - name: Upload to S3
        run: |
          aws s3 sync dist/assets "s3://${{ vars.SITE_BUCKET }}/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --delete \
            --exclude "assets/*" --exclude "status/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths "/*" \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.DISTRIBUTION_ID }}" --id "$id"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ops/requirements.txt
      - run: pip install -r ops/requirements.txt
      - name: Smoke test
        run: python ops/site_health.py --url "${{ vars.SITE_URL }}" --smoke

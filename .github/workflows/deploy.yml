name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Azure

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # $web is the static website container; the URL is the blob endpoint, not the web one.
  WEB_CONTAINER_URL: https://${{ vars.SITE_STORAGE_ACCOUNT }}.blob.core.windows.net/$web
  # AzCopy reuses the az CLI session opened by azure/login.
  AZCOPY_AUTO_LOGIN_TYPE: AZCLI

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skipped until the infrastructure exists and SITE_STORAGE_ACCOUNT is set (see README).
    if: vars.SITE_STORAGE_ACCOUNT != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Hashed assets are cached for a year; HTML and the rest must revalidate.
      # status/ belongs to the health workflow, so the delete must not touch it.
      # No CDN in front, so there is no cache to invalidate afterwards.
      - name: Upload to $web
        run: |
          azcopy sync dist/assets "$WEB_CONTAINER_URL/assets" --delete-destination=true \
            --cache-control "public, max-age=31536000, immutable"
          azcopy sync dist "$WEB_CONTAINER_URL" --delete-destination=true \
            --exclude-path "assets;status" \
            --cache-control "public, max-age=0, must-revalidate"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ops/requirements.txt
      - run: pip install -r ops/requirements.txt
      - name: Smoke test
        run: python ops/site_health.py --url "${{ vars.SITE_URL }}" --smoke

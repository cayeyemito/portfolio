name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  ops:
    name: Ops · pytest y shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ops/requirements-dev.txt
      - run: pip install -r ops/requirements-dev.txt
      - run: python -m pytest -q ops/tests
      - run: shellcheck ops/logs.sh

  terraform:
    name: Terraform · fmt, validate y plan
    runs-on: ubuntu-latest
    # Skipped until the AWS roles exist and their ARNs are set as repository variables.
    if: vars.AWS_PLAN_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
      pull-requests: write # plan comment
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - run: terraform validate
      # Read-only role: plan without taking the state lock.
      - id: plan
        run: |
          terraform plan -input=false -no-color -lock=false -out=tfplan \
            -var="budget_email=${{ vars.BUDGET_EMAIL }}"
          terraform show -no-color tfplan > plan.txt
      - uses: actions/github-script@v9
        if: always() && steps.plan.outcome != 'skipped'
        with:
          script: |
            const fs = require('fs')
            const path = 'infra/plan.txt'
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'El plan ha fallado: revisa el log del job.'
            const body = [
              '### Terraform plan',
              '',
              '<details><summary>Ver el plan</summary>',
              '',
              '```',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n… (recortado)' : plan,
              '```',
              '</details>',
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frimee · Cayetano Yeste</title>
    <meta
      name="description"
      content="Frimee case study: a web and mobile app to plan things as a group, built with Next.js, Supabase, Capacitor and LiveKit."
    />
    <!-- Link previews. VITE_SITE_URL comes from .env, or from vars.SITE_URL in deploy.yml. -->
    <link rel="canonical" href="%VITE_SITE_URL%/en/projects/frimee/" />
    <link rel="alternate" hreflang="en" href="%VITE_SITE_URL%/en/projects/frimee/" />
    <link rel="alternate" hreflang="es" href="%VITE_SITE_URL%/proyectos/frimee/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cayetano Yeste" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:url" content="%VITE_SITE_URL%/en/projects/frimee/" />
    <meta property="og:title" content="Frimee · Cayetano Yeste" />
    <meta
      property="og:description"
      content="Frimee case study: a web and mobile app to plan things as a group, built with Next.js, Supabase, Capacitor and LiveKit."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cayetano Yeste, junior full stack developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved light/dark choice before the first paint (see src/lib/theme.ts).
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pages/frimee.ts"></script>
  </body>
</html>

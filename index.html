<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cayetano Yeste · Desarrollador full stack junior</title>
    <meta
      name="description"
      content="Portfolio de Cayetano Yeste, desarrollador full stack junior (Java/Spring Boot y Vue): proyectos, experiencia y una web desplegada en Azure con Terraform y GitHub Actions."
    />
    <!-- Link previews. VITE_SITE_URL comes from .env, or from vars.SITE_URL in deploy.yml. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="es" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="en" href="%VITE_SITE_URL%/en/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cayetano Yeste" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Cayetano Yeste · Desarrollador full stack junior" />
    <meta
      property="og:description"
      content="Portfolio de Cayetano Yeste, desarrollador full stack junior (Java/Spring Boot y Vue): proyectos, experiencia y una web desplegada en Azure con Terraform y GitHub Actions."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-es.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cayetano Yeste, desarrollador full stack junior" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved light/dark choice before the first paint (see src/lib/theme.ts).
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Esta web necesita JavaScript. Escríbeme a cayetanoym@gmail.com.</noscript>
    <script type="module" src="/src/pages/home.ts"></script>
  </body>
</html>
